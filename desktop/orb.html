<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"><style>
body{display:grid;place-items:center;width:64px;height:64px;margin:0;overflow:hidden;background:transparent}
button{position:relative;display:grid;place-items:center;width:42px;height:42px;margin:0;padding:0;border:0;border-radius:50%;background:transparent;box-shadow:0 5px 16px rgba(19,43,110,.28);cursor:pointer;user-select:none;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
button>img{display:block;width:42px;height:42px;border-radius:50%;object-fit:cover}
button:hover{transform:scale(1.06);filter:brightness(1.08);box-shadow:0 7px 20px rgba(19,43,110,.38)}
.record-dot{display:none;position:absolute;width:9px;height:9px;border:3px solid rgba(255,225,229,.78);border-radius:50%;background:#d94357;box-shadow:0 0 10px rgba(217,67,87,.82)}
button.rec>img{filter:saturate(.72) brightness(.78)}button.rec .record-dot{display:block}button:not(:hover){opacity:.96}
</style></head><body><button id="orb" title="课堂随记 · 点击展开，拖动贴边，右键退出" aria-label="展开学生座位表"><img src="assets/icon.png" alt=""><span class="record-dot" aria-hidden="true"></span></button><script src="orb.js"></script></body></html>
